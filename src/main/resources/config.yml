# ╔══════════════════════════════════════╗
# ║        LunaTGBot  config.yml         ║
# ╚══════════════════════════════════════╝

# Токен твоего Telegram бота
# Получи у @BotFather командой /newbot
bot-token: "YOUR_BOT_TOKEN_HERE"

# Username бота (без @) — показывается игрокам в подсказке
bot-username: "your_bot"

# ── Награда ────────────────────────────────────────────────────────────────
reward:
  # Минимальная сумма (включительно)
  min: 100.0
  # Максимальная сумма (включительно)
  max: 1000.0

# ── Сообщения ──────────────────────────────────────────────────────────────
messages:
  # Название валюты (отображается в сообщениях)
  currency-name: "монет"

  # Игроку при получении кода
  link-code: "&aТвой код привязки: &e{code}"
  link-instruction: "&7Отправь этот код боту &b@{bot} &7в Telegram. Код действует 10 минут."

  # Уже привязан
  already-linked: "&eТвой аккаунт уже привязан. Используй /tgunlink чтобы отвязать."

  # После успешной привязки — сообщение в игре
  linked-ingame: "&aТелеграм успешно привязан! Награда: &e{amount} {currency}"

  # После успешной привязки — сообщение в Telegram
  linked-telegram: "✅ Аккаунт {player} успешно привязан!\n💰 Награда: {amount} {currency}"

  # После отвязки
  unlinked: "&aТвой Telegram аккаунт успешно отвязан."
